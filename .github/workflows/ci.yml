name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run scan:brand
      - run: npm run test:unit
      # Local Supabase (Docker) gives CI a real database for RLS + data-layer tests.
      - name: Start local Supabase
        run: npx supabase start
      - name: Export local keys
        run: |
          npx supabase status -o env > /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep -E '^(PUBLISHABLE_KEY|ANON_KEY)=' /tmp/sb.env | head -1 | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep -E '^(SECRET_KEY|SERVICE_ROLE_KEY)=' /tmp/sb.env | head -1 | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > .env.local
      - run: npx supabase db lint --level warning --fail-on warning
      - run: npx supabase test db
      - name: Generated DB types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          diff -q /tmp/database.types.ts src/lib/supabase/database.types.ts
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run build
      - name: No secrets in client bundle
        run: |
          set -a; . ./.env.local; set +a
          bash scripts/check-bundle-secrets.sh
